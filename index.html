    <!-- Set the theme before first paint: ?theme=dark|light link, else the visitor's saved choice, else dark. -->
    <script>
      try {
        var q = new URLSearchParams(location.search).get('theme')
        document.documentElement.dataset.theme =
          q === 'dark' || q === 'light' ? q : localStorage.getItem('theme') || 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
